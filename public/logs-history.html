<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic History • Chakhdi.local</title>
    <script>
        if (sessionStorage.getItem('dashboardAuth') !== 'true') {
            window.location.href = '/login';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/icons.css">
    <link rel="stylesheet" href="/assets/sidebar.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        :root {
            --bg: #030308;
            --surface: #0a0a14;
            --surface-hover: #121225;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.3);
            --danger: #ff0044;
            --success: #00ff88;
            --warning: #ffcc00;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        /* Page Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }

        .tab.dns.active {
            color: #fca130;
            border-color: #fca130;
            background: rgba(252, 161, 48, 0.1);
        }

        .tab.danger {
            color: var(--danger);
            border-color: rgba(255, 0, 68, 0.3);
            background: rgba(255, 0, 68, 0.08);
        }

        .tab.danger:hover {
            background: rgba(255, 0, 68, 0.15);
            border-color: var(--danger);
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            color: var(--danger);
            border-color: rgba(255, 0, 68, 0.2);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-search {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.15);
        }

        .search-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 8px 12px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .file-item {
            padding: 12px 15px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            padding-right: 45px;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(5px);
        }

        .file-item.active {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--accent);
        }

        .file-name {
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chunk-number {
            background: rgba(0, 243, 255, 0.15);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }

        .file-meta {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quick-delete {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
            opacity: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .file-item:hover .quick-delete {
            opacity: 1;
        }

        .quick-delete:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 0, 68, 0.3);
        }

        .log-display {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .log-entry-delete {
            padding: 2px;
            color: var(--danger);
            border: none;
            background: none;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
        }

        .log-entry-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .method {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.65rem;
            min-width: 70px;
            text-align: center;
        }

        .method-GET {
            background: rgba(97, 175, 254, 0.1);
            color: #61affe;
        }

        .method-POST {
            background: rgba(73, 204, 144, 0.1);
            color: #49cc90;
        }

        .method-BLOCK {
            background: rgba(255, 0, 68, 0.1);
            color: #fa8181;
        }

        .method-CONNECT {
            background: rgba(252, 161, 48, 0.1);
            color: #fca130;
        }

        .method-DELETE {
            background: rgba(249, 62, 62, 0.1);
            color: #f93e3e;
        }

        .query-type {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.65rem;
            min-width: 45px;
            text-align: center;
        }

        .query-type.A {
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .query-type.AAAA {
            background: rgba(161, 48, 252, 0.1);
            color: #a130fc;
            border: 1px solid rgba(161, 48, 252, 0.2);
        }

        .query-type.OTHER {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .user-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;
            min-width: 0;
            max-width: 240px;
            flex: 0 1 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-auth {
            background: rgba(0, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .user-guest {
            background: rgba(136, 136, 170, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(136, 136, 170, 0.2);
        }

        .user-pill .icon {
            font-size: 0.8rem;
        }

        .timestamp {
            color: #50ff0b;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .url,
        .domain {
            color: #ccc;
            flex: 1;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .status.BLOCKED {
            color: var(--danger);
            background: rgba(255, 0, 68, 0.1);
        }

        .status.ALLOWED {
            color: var(--success);
            background: rgba(0, 255, 136, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 15px;
        }

        @media (max-width: 1100px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Background Animations */
        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(80px);
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            top: -200px;
            left: -200px;
        }

        .glow-orb-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.1) translate(30px, 30px);
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--border) 2px, var(--border) 4px);
            pointer-events: none;
            opacity: 0.03;
            z-index: 100;
        }

        .dashboard-wrapper {
            display: flex;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <!-- Animated Background Layers -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scanline"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Dashboard Wrapper -->
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="header">
                <h1><span class="icon icon-lg">manage_search</span> Traffic Log Explorer</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="tab active" id="allTab" onclick="switchService('all')">All Traffic</div>
                    <div class="tab" id="proxyTab" onclick="switchService('proxy')">Proxy Only</div>
                    <div class="tab dns" id="dnsTab" onclick="switchService('dns')">DNS Only</div>
                    <div id="clearLogsTab" class="tab danger" onclick="clearAllLogs()" style="display: none;">
                        <span class="icon" style="font-size: 0.9rem;">delete_sweep</span> Clear All
                    </div>
                </div>
            </div>

            <div class="content-grid">
                <div class="panel">
                    <div class="panel-header">
                        <span id="listTitle" style="font-weight: 600; font-size: 0.85rem;">Log Chunks</span>
                        <span id="slotCount"
                            style="color: var(--accent); font-size: 0.75rem; font-weight: 700;">0</span>
                    </div>
                    <div class="file-list" id="slotList">
                        <div class="empty-state">Loading chunks...</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span id="activeSlotName"
                            style="font-weight: 600; font-size: 0.85rem; color: var(--accent);">Select a chunk</span>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span id="logCount" style="font-size: 0.7rem; font-weight: 700; color: var(--success);">0
                                Records</span>
                            <button id="wipeBtn" class="btn btn-danger"
                                style="display: none; padding: 4px 10px; font-size: 0.7rem;"
                                onclick="wipeCurrentChunk()">
                                <span class="icon" style="font-size: 0.8rem;">delete_sweep</span> Wipe Chunk
                            </button>
                        </div>
                    </div>
                    <div class="log-search">
                        <input type="text" id="logSearch" class="search-box" placeholder="Search URL/domain/path..."
                            oninput="onLogSearchInput()">
                    </div>
                    <div class="log-display" id="logDisplay">
                        <div class="empty-state">
                            <span class="icon icon-xl" style="opacity: 0.2;">folder_open</span>
                            <div>Select a chunk to view logs</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div><!-- .dashboard-wrapper -->

    <script src="/assets/sidebar.js"></script>
    <script src="/assets/modal.js"></script>
    <script>
        let currentService = 'all';
        let currentChunk = null;
        let currentChunkPage = null;
        let currentLogs = [];
        let logSearchQuery = '';
        const CHUNK_SIZE = 1000;
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const currentSessionId = sessionStorage.getItem('sessionId') || 'unknown';

        // RBAC UI: Show/Hide elements based on role
        if (currentUser.role === 'admin') {
            const clearLogsTab = document.getElementById('clearLogsTab');
            if (clearLogsTab) clearLogsTab.style.display = 'block';
        } else {
            const wipeBtn = document.getElementById('wipeBtn');
            if (wipeBtn) wipeBtn.remove();
        }

        async function fetchWithAudit(url, options = {}) {
            options.headers = {
                ...options.headers,
                'x-user': currentUser.username,
                'x-session-id': currentSessionId,
                'user-agent': navigator.userAgent
            };
            return fetch(url, options);
        }

        function switchService(service) {
            currentService = service;
            currentChunk = null;
            currentChunkPage = null;
            currentLogs = [];
            logSearchQuery = '';

            document.getElementById('allTab').classList.toggle('active', service === 'all');
            document.getElementById('proxyTab').classList.toggle('active', service === 'proxy');
            document.getElementById('dnsTab').classList.toggle('active', service === 'dns');

            let title = 'All Traffic';
            if (service === 'proxy') title = 'Proxy Only';
            else if (service === 'dns') title = 'DNS Only';

            document.getElementById('listTitle').textContent = `Log Chunks (${title})`;
            document.getElementById('activeSlotName').textContent = 'Select a chunk';
            document.getElementById('logDisplay').innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">folder_open</span><div>Select a chunk to view logs</div></div>';
            document.getElementById('wipeBtn').style.display = 'none';
            document.getElementById('logCount').textContent = '0 Records';
            document.getElementById('logSearch').value = '';

            loadChunks();
        }

        async function loadChunks() {
            const list = document.getElementById('slotList');
            list.innerHTML = '<div class="empty-state">Loading chunks...</div>';

            try {
                // Determine log type parameter
                let logType = '';
                if (currentService === 'proxy') logType = 'proxy';
                else if (currentService === 'dns') logType = 'dns';

                // Get total count
                const countRes = await fetchWithAudit(`/api/traffic/logs?limit=1&type=${logType}`);
                const countData = await countRes.json();
                const total = countData.total;

                if (total === 0) {
                    list.innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">inbox</span><div>No logs available</div></div>';
                    document.getElementById('slotCount').textContent = '0';
                    return;
                }

                // Calculate number of chunks
                const totalChunks = Math.ceil(total / CHUNK_SIZE);
                document.getElementById('slotCount').textContent = totalChunks;

                // Generate chunk list
                const chunks = [];
                for (let i = 0; i < totalChunks; i++) {
                    const page = i + 1;
                    const startIndex = i * CHUNK_SIZE + 1;
                    const endIndex = Math.min((i + 1) * CHUNK_SIZE, total);
                    const chunkSize = endIndex - startIndex + 1;

                    chunks.push({
                        page: page,
                        name: `Chunk #${page}`,
                        range: `${startIndex.toLocaleString()} - ${endIndex.toLocaleString()}`,
                        count: chunkSize
                    });
                }

                // Render chunks (newest first)
                chunks.reverse();
                list.innerHTML = chunks.map(chunk => `
                    <div class="file-item ${currentChunk === chunk.page ? 'active' : ''}" onclick="loadChunkLogs(${chunk.page}, '${chunk.name}', this)">
                        <div class="file-name">
                            <span class="chunk-number">#${chunk.page}</span>
                            ${chunk.name}
                        </div>
                        <div class="file-meta">
                            <span>${chunk.range}</span>
                            <span>${chunk.count.toLocaleString()} logs</span>
                        </div>
                        ${currentUser.role === 'admin' ? `
                        <button class="quick-delete" onclick="event.stopPropagation(); quickDeleteChunk(${chunk.page}, '${chunk.name}')" title="Delete Chunk">
                            <span class="icon">close</span>
                        </button>` : ''}
                    </div>
                `).join('');

                if (!currentChunk && chunks.length > 0) {
                    loadChunkLogs(chunks[0].page, chunks[0].name, list.querySelector('.file-item'));
                }
            } catch (e) {
                console.error('Error loading chunks:', e);
                list.innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">error</span><div>Failed to load chunks</div></div>';
            }
        }

        function getFilteredLogs() {
            const query = logSearchQuery.trim().toLowerCase();
            if (!query) return currentLogs;

            return currentLogs.filter(log => {
                const target = `${log.url || ''} ${log.host || ''} ${log.domain || ''}`.toLowerCase();
                return target.includes(query);
            });
        }

        function renderLogs(logs) {
            const display = document.getElementById('logDisplay');
            const query = logSearchQuery.trim().toLowerCase();

            if (currentLogs.length === 0) {
                document.getElementById('logCount').textContent = '0 Records';
                display.innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">inbox</span><div>No logs in this chunk</div></div>';
                return;
            }

            if (logs.length === 0) {
                document.getElementById('logCount').textContent = '0 Records';
                display.innerHTML = query
                    ? '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">search</span><div>No logs match this search</div></div>'
                    : '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">inbox</span><div>No logs in this chunk</div></div>';
                return;
            }

            document.getElementById('logCount').textContent = `${logs.length} Records`;

            display.innerHTML = logs.map(log => {
                // Fix UTC timestamp parsing - force UTC interpretation then convert to local
                const timestampStr = log.timestamp.includes('T') ? log.timestamp : log.timestamp.replace(' ', 'T') + 'Z';
                const time = new Date(timestampStr).toLocaleString();
                const logType = log.log_type || 'proxy';

                if (logType === 'proxy') {
                    return `
                        <div class="log-entry">
                            ${currentUser.role === 'admin' ? `
                            <button class="log-entry-delete" onclick="deleteLogEntry(${log.id})" title="Delete Log">
                                <span class="icon">close</span>
                            </button>` : ''}
                            <span class="timestamp">${time}</span>
                            <span class="user-pill ${log.user ? 'user-auth' : 'user-guest'}" title="${log.user || log.client_ip || 'Internal'}">
                                <span class="icon">${log.user ? 'person' : 'public'}</span>
                                ${log.user || log.client_ip || 'Internal'}
                            </span>
                            <span class="method method-${log.method}">${log.method}</span>
                            <span class="url" title="${log.url}">${log.host || log.url}</span>
                        </div>
                    `;
                }

                return `
                    <div class="log-entry">
                        ${currentUser.role === 'admin' ? `
                        <button class="log-entry-delete" onclick="deleteLogEntry(${log.id})" title="Delete Log">
                            <span class="icon">close</span>
                        </button>` : ''}
                        <span class="timestamp">${time}</span>
                        <span class="user-pill ${log.user ? 'user-auth' : 'user-guest'}" title="${log.user || log.client_ip || 'Internal'}">
                            <span class="icon">${log.user ? 'person' : 'public'}</span>
                            ${log.user || log.client_ip || 'Internal'}
                        </span>
                        <span class="query-type ${['A', 'AAAA'].includes(log.record_type) ? log.record_type : 'OTHER'}">${log.record_type || 'A'}</span>
                        <span class="domain" title="${log.domain}">${log.domain}</span>
                        ${log.status ? `<span class="status ${log.status}">${log.status}</span>` : ''}
                    </div>
                `;
            }).join('');
        }

        function onLogSearchInput() {
            logSearchQuery = document.getElementById('logSearch').value;
            if (!currentChunk) return;
            renderLogs(getFilteredLogs());
        }

        async function loadChunkLogs(page, chunkName, chunkElement) {
            currentChunk = page;
            currentChunkPage = page;

            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
            const activeElement = chunkElement || (typeof event !== 'undefined' ? event.currentTarget : null);
            if (activeElement) activeElement.classList.add('active');

            document.getElementById('activeSlotName').textContent = chunkName;
            document.getElementById('logCount').textContent = 'Loading...';
            document.getElementById('wipeBtn').style.display = 'inline-flex';
            document.getElementById('logDisplay').innerHTML = '<div class="empty-state">Loading logs...</div>';

            try {
                // Determine log type
                let logType = '';
                if (currentService === 'proxy') logType = 'proxy';
                else if (currentService === 'dns') logType = 'dns';

                // Fetch chunk
                const res = await fetchWithAudit(`/api/traffic/logs?page=${page}&limit=${CHUNK_SIZE}&type=${logType}`);
                const data = await res.json();
                currentLogs = data.logs;
                logSearchQuery = document.getElementById('logSearch').value;
                renderLogs(getFilteredLogs());
            } catch (e) {
                console.error('Error loading chunk:', e);
                document.getElementById('logDisplay').innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">error</span><div>Failed to load logs</div></div>';
            }
        }

        async function deleteLogEntry(logId) {
            try {
                await fetchWithAudit('/api/traffic/logs', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ logId })
                });

                // Reload current chunk
                const activeChunk = document.querySelector('.file-item.active');
                if (activeChunk) {
                    activeChunk.click();
                }
            } catch (e) {
                console.error('Error deleting log:', e);
                await customAlert('Failed to delete log entry', 'Error');
            }
        }

        async function wipeCurrentChunk() {
            if (!currentChunk) return;

            if (await customDelete(`Permanently delete all ${CHUNK_SIZE} logs in Chunk #${currentChunk}?`, 'Wipe Chunk')) {
                await quickDeleteChunk(currentChunk, `Chunk #${currentChunk}`);
            }
        }

        async function quickDeleteChunk(chunkPage, chunkName) {
            try {
                // Determine log type
                let logType = '';
                if (currentService === 'proxy') logType = 'proxy';
                else if (currentService === 'dns') logType = 'dns';

                // Get the logs in this chunk first
                const res = await fetchWithAudit(`/api/traffic/logs?page=${chunkPage}&limit=${CHUNK_SIZE}&type=${logType}`);
                const data = await res.json();
                const logs = data.logs;

                // Delete each log individually
                for (const log of logs) {
                    await fetchWithAudit('/api/traffic/logs', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ logId: log.id })
                    });
                }

                // Reset view
                if (currentChunk === chunkPage) {
                    currentChunk = null;
                    currentChunkPage = null;
                    document.getElementById('activeSlotName').textContent = 'Select a chunk';
                    document.getElementById('logDisplay').innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">folder_open</span><div>Select a chunk to view logs</div></div>';
                    document.getElementById('wipeBtn').style.display = 'none';
                    document.getElementById('logCount').textContent = '0 Records';
                }

                // Reload chunks
                await loadChunks();
                await customAlert(`Successfully deleted ${chunkName}`, 'Success');
            } catch (e) {
                console.error('Error deleting chunk:', e);
                await customAlert('Failed to delete chunk', 'Error');
            }
        }

        async function clearAllLogs() {
            let logTypeText = 'all traffic';
            let logType = '';
            if (currentService === 'proxy') {
                logTypeText = 'all proxy';
                logType = 'proxy';
            } else if (currentService === 'dns') {
                logTypeText = 'all DNS';
                logType = 'dns';
            }

            const confirmed = await customDelete(
                `Clear ${logTypeText} logs? This action cannot be undone.`,
                'Clear All Logs'
            );
            if (!confirmed) return;

            try {
                await fetchWithAudit('/api/traffic/logs', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ logType })
                });

                // Reset view
                currentChunk = null;
                currentChunkPage = null;
                document.getElementById('activeSlotName').textContent = 'Select a chunk';
                document.getElementById('logDisplay').innerHTML = '<div class="empty-state"><span class="icon icon-xl" style="opacity: 0.2;">folder_open</span><div>Select a chunk to view logs</div></div>';
                document.getElementById('wipeBtn').style.display = 'none';
                document.getElementById('logCount').textContent = '0 Records';

                // Reload chunks
                await loadChunks();
                await customAlert(`Successfully cleared ${logTypeText} logs`, 'Success');
            } catch (error) {
                console.error('Error clearing logs:', error);
                await customAlert('Failed to clear logs. Please try again.', 'Error');
            }
        }

        // Initialize - Check URL parameter for service type
        const urlParams = new URLSearchParams(window.location.search);
        const serviceType = urlParams.get('type');

        if (serviceType === 'dns') {
            switchService('dns');
        } else if (serviceType === 'proxy') {
            switchService('proxy');
        } else {
            switchService('all'); // Default to all traffic
        }

        // Log page view
        fetchWithAudit('/api/audit/page-view', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page: 'Traffic History' })
        }).catch(err => console.error('Page view audit error:', err));
    </script>

    <script>
        // Background animations
        (function () {
            const CONFIG = {
                PARTICLE_COUNT: 50,
                PARTICLE_REPEL_DISTANCE: 200,
                CONNECTION_MAX_DISTANCE: 120,
                PARTICLE_SPEED_MULTIPLIER: 0.5,
                PARTICLE_SIZE_MIN: 1,
                PARTICLE_SIZE_MAX: 3,
                PARTICLE_OPACITY_MIN: 0.2,
                PARTICLE_OPACITY_MAX: 0.5,
                CONNECTION_OPACITY_BASE: 0.15
            };

            // Particle System
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width, height;
            let mouseX = 0, mouseY = 0;
            let particles = [];
            let animationFrameId = null;
            let isTabVisible = !document.hidden;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            document.addEventListener('visibilitychange', () => {
                isTabVisible = !document.hidden;
                if (isTabVisible && !animationFrameId) {
                    animate();
                }
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * (CONFIG.PARTICLE_SIZE_MAX - CONFIG.PARTICLE_SIZE_MIN) + CONFIG.PARTICLE_SIZE_MIN;
                    this.speedX = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.speedY = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.opacity = Math.random() * (CONFIG.PARTICLE_OPACITY_MAX - CONFIG.PARTICLE_OPACITY_MIN) + CONFIG.PARTICLE_OPACITY_MIN;
                }

                update() {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONFIG.PARTICLE_REPEL_DISTANCE) {
                        const force = (CONFIG.PARTICLE_REPEL_DISTANCE - dist) / CONFIG.PARTICLE_REPEL_DISTANCE;
                        this.x -= (dx / dist) * force * 3;
                        this.y -= (dy / dist) * force * 3;
                    }

                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.CONNECTION_MAX_DISTANCE) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 243, 255, ${CONFIG.CONNECTION_OPACITY_BASE * (1 - dist / CONFIG.CONNECTION_MAX_DISTANCE)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                if (!isTabVisible) {
                    animationFrameId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                drawConnections();
                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
