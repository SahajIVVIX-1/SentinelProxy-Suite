<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocklist • Chakhdi.local</title>
    <script>
        if (sessionStorage.getItem('dashboardAuth') !== 'true') {
            window.location.href = '/login';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/icons.css">
    <link rel="stylesheet" href="/assets/sidebar.css">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 50 10 L 80 30 L 80 70 L 50 90 L 20 70 L 20 30 Z' fill='%23ff0044' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M 35 50 L 65 50' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #030308;
            --surface: #0a0a14;
            --surface-hover: #121225;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.3);
            --danger: #ff0044;
            --success: #00ff88;
            --warning: #ffcc00;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        .theme-proxy {
            --accent: #ff0044;
            --accent-glow: rgba(255, 0, 68, 0.3);
        }

        .theme-dns {
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 16px;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            background-clip: content-box;
        }


        /* Shared styles moved to sidebar.css */

        /* Page Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            animation: fadeIn 0.4s ease-out;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-accent {
            background: var(--accent);
            color: #000;
            border: none;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .domain-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .domain-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .domain-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .domain-item input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .domain-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 0, 68, 0.1);
            color: var(--danger);
            font-weight: 700;
        }

        .pagination {
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }

        .import-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin: 15px;
        }

        .import-zone:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.02);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
        }

        textarea {
            width: calc(100% - 30px);
            margin: 0 15px 15px;
            height: 180px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        @media (max-width: 1000px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 80px;
            }

            .logo span:not(.icon),
            .nav-item span:not(.icon) {
                display: none;
            }

            :root {
                --sidebar-width: 80px;
            }
        }

        /* Background Animations */
        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(80px);
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            top: -200px;
            left: -200px;
        }

        .glow-orb-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.1) translate(30px, 30px);
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--border) 2px, var(--border) 4px);
            pointer-events: none;
            opacity: 0.03;
            z-index: 100;
        }

        .dashboard-wrapper {
            display: flex;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body class="theme-proxy" id="bodyTheme">
    <!-- Animated Background Layers -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scanline"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Dashboard Wrapper -->
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        <script src="/assets/sidebar.js"></script>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <h1 id="pageTitle"><span class="icon">block</span> Proxy Blocklist</h1>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 15px;">
                        <span><strong id="domainCount" style="color: var(--accent);">0</strong> Domains</span>
                        <span><strong id="fileCount" style="color: var(--accent);">0</strong> Files</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" onclick="refreshBlocklists()"><span class="icon spin-hover">sync</span>
                        Refresh</button>
                    <input type="text" id="searchInput" placeholder="Search domains..." oninput="onSearch()">
                    <button class="btn" id="selectPageBtn" onclick="toggleSelectPage()" style="display: none;">
                        <span class="icon">select_all</span> Select Page
                    </button>
                    <button class="btn" id="deleteSelectedBtn" onclick="deleteSelected()" style="display: none;">
                        <span class="icon">delete</span> Delete Selected
                    </button>
                    <button class="btn" id="deleteSearchBtn" onclick="deleteSearchMatches()" style="display: none;">
                        <span class="icon">filter_alt_off</span> Delete Search
                    </button>
                    <select id="pageSize" onchange="onPageSizeChange()" style="min-width: 110px;">
                        <option value="100">100 / page</option>
                        <option value="500">500 / page</option>
                        <option value="1000">1,000 / page</option>
                        <option value="5000">5,000 / page</option>
                    </select>
                    <a href="/proxy" id="backBtn" class="btn"><span class="icon">arrow_back</span> Return</a>
                </div>
            </div>

            <div class="content-grid">
                <div class="panel">
                    <div class="panel-header">
                        <span style="font-weight: 600; font-size: 0.9rem;">Blocked Entities</span>
                        <span id="pageInfo" style="font-size: 0.75rem; color: var(--text-secondary);">Page 1 of 1</span>
                    </div>
                    <div class="domain-list" id="domainList"></div>
                    <div class="pagination">
                        <button class="btn" style="padding: 4px 12px; font-size: 0.7rem;"
                            onclick="changePage(-1)">Previous</button>
                        <span id="pageNumber" style="font-weight: 700; color: var(--accent);">1</span>
                        <button class="btn" style="padding: 4px 12px; font-size: 0.7rem;"
                            onclick="changePage(1)">Next</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header"><span style="font-weight: 600; font-size: 0.9rem;">Import & Manual
                            Block</span></div>

                    <div class="import-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                        <span class="icon icon-xl" style="opacity: 0.5;">create_new_folder</span>
                        <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px;">Click to import
                            Folder (Recursive)</div>
                        <div style="font-size: 0.65rem; color: var(--text-secondary); opacity: 0.7;">.txt files only
                        </div>
                        <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none"
                            onchange="handleFileUpload(event)">
                    </div>

                    <div
                        style="padding: 0 20px 10px; font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">
                        Active Lists</div>
                    <div id="fileList"
                        style="max-height: 200px; overflow-y: auto; margin-bottom: 20px; padding: 0 5px;">
                    </div>

                    <div
                        style="padding: 0 20px 10px; font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">
                        Direct Entry</div>
                    <textarea id="manualInput" placeholder="Enter domains (one per line)..."></textarea>
                    <button class="btn btn-accent"
                        style="margin: 0 15px 15px; justify-content: center; font-weight: 700;"
                        onclick="addManual()">Apply Blocks</button>
                </div>
            </div>
        </main>
    </div><!-- .dashboard-wrapper -->

    <script src="/assets/modal.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'proxy';
        const apiBase = `/api/${type}/blocklist`;
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = parseInt(localStorage.getItem('blocklistPageSize') || '1000', 10);
        let searchQuery = '';
        let searchTimeout;
        let selectedDomains = new Set();
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');

        document.body.className = `theme-${type}`;
        document.getElementById('pageTitle').innerHTML = `<span class="icon">${type === 'dns' ? 'dns' : 'shield'}</span> ${type.toUpperCase()} Blocklist`;
        document.getElementById('backBtn').href = `/${type}`;
        const currentSessionId = sessionStorage.getItem('sessionId') || 'unknown';
        const pageSizeSelect = document.getElementById('pageSize');
        if (pageSizeSelect) pageSizeSelect.value = String(pageSize);

        const selectPageBtn = document.getElementById('selectPageBtn');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        const deleteSearchBtn = document.getElementById('deleteSearchBtn');
        if (currentUser.role === 'admin') {
            if (selectPageBtn) selectPageBtn.style.display = 'inline-flex';
            if (deleteSelectedBtn) deleteSelectedBtn.style.display = 'inline-flex';
            if (deleteSearchBtn) deleteSearchBtn.style.display = 'inline-flex';
        }

        /* Shared sidebar functions are now in sidebar.js */
        async function fetchWithAudit(url, options = {}) {
            options.headers = {
                ...options.headers,
                'x-user': currentUser.username,
                'x-session-id': currentSessionId,
                'user-agent': navigator.userAgent
            };
            return fetch(url, options);
        }

        async function loadData() {
            try {
                const res = await fetchWithAudit(`${apiBase}?page=${currentPage}&limit=${pageSize}&search=${encodeURIComponent(searchQuery)}`);
                const data = await res.json();
                totalPages = Math.max(data.totalPages || 1, 1);
                document.getElementById('domainCount').textContent = data.total.toLocaleString();
                document.getElementById('fileCount').textContent = data.files.length;
                document.getElementById('pageInfo').textContent = `Page ${currentPage.toLocaleString()} of ${totalPages.toLocaleString()} • ${pageSize.toLocaleString()}/page`;
                document.getElementById('pageNumber').textContent = currentPage.toLocaleString();
                renderDomains(data.domains);
                renderFiles(data.files);

                updateBulkButtons();

                // RBAC: Hide modification UI for non-admins
                if (currentUser.role !== 'admin') {
                    if (document.getElementById('dropZone')) document.getElementById('dropZone').style.display = 'none';
                    if (document.getElementById('manualInput')) document.getElementById('manualInput').style.display = 'none';
                    const applyBtn = document.querySelector('.btn-accent');
                    if (applyBtn) applyBtn.style.display = 'none';

                    // Hide headers
                    const panels = document.querySelectorAll('.panel');
                    if (panels[1]) {
                        const directEntryHeader = Array.from(panels[1].querySelectorAll('div')).find(div => div.textContent.trim() === 'Direct Entry');
                        if (directEntryHeader) directEntryHeader.style.display = 'none';
                    }
                }
            } catch (e) { }
        }

        function renderDomains(domains) {
            const list = document.getElementById('domainList');
            list.innerHTML = domains.map(d => `
                <div class="domain-item">
                    <div class="domain-name"><span class="badge">LOCKED</span> ${d}</div>
                    ${currentUser.role === 'admin' ? `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-secondary);">
                            <input type="checkbox" data-domain="${d}" ${selectedDomains.has(d) ? 'checked' : ''} onchange="toggleDomainSelection('${d}', this.checked)">
                            Select
                        </label>
                        <button class="btn" style="padding: 2px 6px; color: var(--danger); border: none;" onclick="removeDomain('${d}')">
                            <span class="icon" style="font-size: 0.8rem;">close</span>
                        </button>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function renderFiles(sources) {
            const list = document.getElementById('fileList');
            if (!sources || sources.length === 0) {
                list.innerHTML = '<div style="color: var(--text-secondary); padding: 10px; text-align: center;">No sources loaded</div>';
                return;
            }
            list.innerHTML = sources.map(s => `
                <div class="file-item">
                    <div style="flex: 1; overflow: hidden;">
                        <div style="font-weight:600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${s.type === 'file' ? '📄' : '✏️'} ${s.name}
                        </div>
                        <div style="color:var(--text-secondary); font-size:0.7rem;">${s.count.toLocaleString()} domains</div>
                    </div>
                    ${currentUser.role === 'admin' ? `
                    <button class="btn" style="padding: 2px 6px; color: var(--danger); border: none;" onclick="deleteSource('${s.name}', '${s.type}')">
                        <span class="icon" style="font-size: 0.8rem;">delete</span>
                    </button>` : ''}
                </div>
            `).join('');
        }

        async function removeDomain(domain) {
            await fetchWithAudit(apiBase, {
                method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domain })
            });
            selectedDomains.delete(domain);
            loadData();
        }

        function toggleDomainSelection(domain, isSelected) {
            if (isSelected) selectedDomains.add(domain);
            else selectedDomains.delete(domain);
            updateBulkButtons();
        }

        function toggleSelectPage() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][data-domain]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
                const domain = cb.getAttribute('data-domain');
                if (!domain) return;
                if (!allChecked) selectedDomains.add(domain);
                else selectedDomains.delete(domain);
            });
            updateBulkButtons();
        }

        async function deleteSelected() {
            if (selectedDomains.size === 0) return;
            const confirmed = await customDelete(`Delete ${selectedDomains.size} selected domains?`, 'Delete Selected');
            if (!confirmed) return;

            const domains = Array.from(selectedDomains);
            await fetchWithAudit(apiBase, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domains })
            });
            selectedDomains.clear();
            loadData();
        }

        async function deleteSearchMatches() {
            const keyword = searchQuery.trim();
            if (!keyword) {
                customAlert('Enter a search keyword first.', 'Search Required');
                return;
            }
            const confirmed = await customDelete(`Delete all domains containing "${keyword}"?`, 'Delete Search Results');
            if (!confirmed) return;

            await fetchWithAudit(apiBase, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ search: keyword })
            });
            selectedDomains.clear();
            loadData();
        }

        async function deleteSource(name, type) {
            const sourceName = type === 'file' ? name : name;
            await fetchWithAudit(`${apiBase}/files/${encodeURIComponent(sourceName)}`, { method: 'DELETE' });
            loadData();
        }

        async function addManual() {
            const val = document.getElementById('manualInput').value;
            const domains = val.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
            if (domains.length === 0) return;
            await fetchWithAudit(apiBase, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domains })
            });
            document.getElementById('manualInput').value = '';
            loadData();
        }

        async function refreshBlocklists() {
            showProgressModal('Reloading Rules', 'Applying latest changes...');
            try {
                await fetchWithAudit(`${apiBase}/reload`, { method: 'POST' });
                await new Promise(r => setTimeout(r, 800)); // Minimum duration for visual comfort
                closeProgressModal();
                loadData();
                customAlert('Blocklists reloaded successfully.', 'System Updated');
            } catch (e) {
                closeProgressModal();
                customAlert('Failed to reload blocklists.', 'Error');
            }
        }

        // Initialize Drag and Drop
        const dropZone = document.getElementById('dropZone');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        // Highlight drop zone when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        // Handle dropped files
        dropZone.addEventListener('drop', handleDrop, false);

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function highlight(e) {
            dropZone.style.borderColor = 'var(--accent)';
            dropZone.style.background = 'rgba(255, 255, 255, 0.05)';
        }

        function unhighlight(e) {
            dropZone.style.borderColor = 'var(--border)';
            dropZone.style.background = 'transparent';
        }

        async function handleDrop(e) {
            const items = e.dataTransfer.items;
            if (!items || items.length === 0) return;

            showProgressModal('Scanning Files', 'analyzing dropped content...');
            const fileList = [];

            // Use GetAsEntry for recursive folder support
            const entries = [];
            for (let i = 0; i < items.length; i++) {
                const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : items[i].getAsEntry();
                if (entry) entries.push(entry);
            }

            for (const entry of entries) {
                await traverseFileTree(entry, '', fileList);
            }

            closeProgressModal();
            if (fileList.length > 0) {
                // If more than 3 files, ask for confirmation
                if (fileList.length > 3) {
                    const proceed = await customConfirm(`You are about to import ${fileList.length} files. Continue?`);
                    if (!proceed) return;
                }
                processFiles(fileList);
            } else {
                customAlert('No .txt files found in dropped selection.', 'Import Failed');
            }
        }

        function traverseFileTree(item, path, fileList) {
            return new Promise((resolve) => {
                if (item.isFile) {
                    item.file((file) => {
                        // Store file and its relative path (constructed from folder structure)
                        if (file.name.endsWith('.txt')) {
                            const fullPath = path + file.name;
                            fileList.push({ file, path: fullPath });
                        }
                        resolve();
                    });
                } else if (item.isDirectory) {
                    const dirReader = item.createReader();
                    const readEntries = () => {
                        dirReader.readEntries(async (entries) => {
                            if (entries.length > 0) {
                                for (const entry of entries) {
                                    await traverseFileTree(entry, path + item.name + "_", fileList);
                                }
                                readEntries(); // Continue reading because readEntries might not return all at once
                            } else {
                                resolve();
                            }
                        });
                    };
                    readEntries();
                } else {
                    resolve();
                }
            });
        }

        async function handleFileUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Normalize input files to our fileItem structure { file, path }
            const fileList = files
                .filter(f => f.name.endsWith('.txt'))
                .map(f => ({
                    file: f,
                    path: f.webkitRelativePath || f.name
                }));

            if (fileList.length > 0) {
                // If more than 3 files, ask for confirmation
                if (fileList.length > 3) {
                    const proceed = await customConfirm(`You are about to import ${fileList.length} files. Continue?`);
                    if (!proceed) {
                        e.target.value = '';
                        return;
                    }
                }
                processFiles(fileList);
            } else {
                customAlert('No valid .txt files selected.', 'Import Failed');
            }
            e.target.value = '';
        }

        async function processFiles(fileList) {
            let successCount = 0;
            // Show cancel button during import
            showProgressModal('Importing Blocklists', 'Initializing...', true);

            for (let i = 0; i < fileList.length; i++) {
                // Check if cancelled
                if (window.importCancelled) {
                    closeProgressModal();
                    customAlert(`Import cancelled. ${successCount} files imported before cancellation.`, 'Cancelled');
                    loadData();
                    return;
                }

                const { file, path } = fileList[i];

                updateProgressModal(`Processing ${i + 1}/${fileList.length}: ${path}`);

                try {
                    const content = await readFileContent(file);
                    const safeFilename = path.replace(/[\\\\/]/g, '_');

                    await fetchWithAudit(`${apiBase}/import`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: safeFilename, content })
                    });
                    successCount++;
                } catch (err) {
                    console.error('Import failed for', path, err);
                }
            }

            closeProgressModal();
            if (successCount > 0) {
                await customAlert(`Successfully imported ${successCount} blocklist files.`, 'Import Complete');
                loadData();
            } else {
                customAlert('Import failed or no files were processed.', 'Error');
            }
        }

        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsText(file);
            });
        }

        function onSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('searchInput').value;
                currentPage = 1;
                selectedDomains.clear();
                loadData();
            }, 300);
        }

        function updateBulkButtons() {
            if (currentUser.role !== 'admin') return;
            const hasSelected = selectedDomains.size > 0;
            if (deleteSelectedBtn) deleteSelectedBtn.disabled = !hasSelected;
            if (deleteSelectedBtn) deleteSelectedBtn.style.opacity = hasSelected ? '1' : '0.5';

            const hasSearch = searchQuery.trim().length > 0;
            if (deleteSearchBtn) deleteSearchBtn.disabled = !hasSearch;
            if (deleteSearchBtn) deleteSearchBtn.style.opacity = hasSearch ? '1' : '0.5';
        }

        function onPageSizeChange() {
            const value = parseInt(document.getElementById('pageSize').value, 10);
            pageSize = Number.isNaN(value) ? 1000 : value;
            localStorage.setItem('blocklistPageSize', String(pageSize));
            currentPage = 1;
            loadData();
        }

        function changePage(delta) {
            if (totalPages <= 1) return;
            let next = currentPage + delta;
            if (next >= 1 && next <= totalPages) {
                currentPage = next;
                loadData();
            }
        }

        loadData();
        fetchWithAudit('/api/audit/page-view', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: 'Blocklist Manager' })
        });
    </script>

    <script>
        // Background animations
        (function () {
            const CONFIG = {
                PARTICLE_COUNT: 50,
                PARTICLE_REPEL_DISTANCE: 200,
                CONNECTION_MAX_DISTANCE: 120,
                PARTICLE_SPEED_MULTIPLIER: 0.5,
                PARTICLE_SIZE_MIN: 1,
                PARTICLE_SIZE_MAX: 3,
                PARTICLE_OPACITY_MIN: 0.2,
                PARTICLE_OPACITY_MAX: 0.5,
                CONNECTION_OPACITY_BASE: 0.15
            };

            // Particle System
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width, height;
            let mouseX = 0, mouseY = 0;
            let particles = [];
            let animationFrameId = null;
            let isTabVisible = !document.hidden;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            document.addEventListener('visibilitychange', () => {
                isTabVisible = !document.hidden;
                if (isTabVisible && !animationFrameId) {
                    animate();
                }
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * (CONFIG.PARTICLE_SIZE_MAX - CONFIG.PARTICLE_SIZE_MIN) + CONFIG.PARTICLE_SIZE_MIN;
                    this.speedX = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.speedY = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.opacity = Math.random() * (CONFIG.PARTICLE_OPACITY_MAX - CONFIG.PARTICLE_OPACITY_MIN) + CONFIG.PARTICLE_OPACITY_MIN;
                }

                update() {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONFIG.PARTICLE_REPEL_DISTANCE) {
                        const force = (CONFIG.PARTICLE_REPEL_DISTANCE - dist) / CONFIG.PARTICLE_REPEL_DISTANCE;
                        this.x -= (dx / dist) * force * 3;
                        this.y -= (dy / dist) * force * 3;
                    }

                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
                    const rgb = accentColor.match(/\d+/g);
                    if (rgb && rgb.length >= 3) {
                        ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${this.opacity})`;
                    } else {
                        ctx.fillStyle = `rgba(255, 0, 68, ${this.opacity})`;
                    }
                    ctx.fill();
                }
            }

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawConnections() {
                const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
                const rgb = accentColor.match(/\d+/g);
                const baseColor = (rgb && rgb.length >= 3) ? `${rgb[0]}, ${rgb[1]}, ${rgb[2]}` : '255, 0, 68';

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.CONNECTION_MAX_DISTANCE) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(${baseColor}, ${CONFIG.CONNECTION_OPACITY_BASE * (1 - dist / CONFIG.CONNECTION_MAX_DISTANCE)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                if (!isTabVisible) {
                    animationFrameId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                drawConnections();
                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
</body>
