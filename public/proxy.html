<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy • Chakhdi.local</title>
    <script>
        if (sessionStorage.getItem('dashboardAuth') !== 'true') {
            window.location.href = '/login';
        }
    </script>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff0044' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M 30 50 L 70 50' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M 50 30 L 50 70' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/icons.css">
    <link rel="stylesheet" href="/assets/sidebar.css">
    <style>
        :root {
            --bg: #030308;
            --surface: #0a0a14;
            --surface-hover: #121225;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --accent: #ff0044;
            --accent-glow: rgba(255, 0, 68, 0.3);
            --danger: #ff0044;
            --success: #00ff88;
            --warning: #ffcc00;
            --request: #8369f7;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 16px;
        }

        /* Page Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            background-clip: content-box;
        }


        /* Shared styles moved to sidebar.css */

        /* Main Content area */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* Panel & Query List Styling (Matching DNS) */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .query-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .query-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .query-item.blocked {
            border-left: 3px solid var(--danger);
        }

        .query-item.allowed {
            border-left: 3px solid var(--success);
        }

        .query-time {
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            min-width: 75px;
        }

        .query-type {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 75px;
            text-align: center;
        }

        .query-type.BLOCK {
            background: rgba(255, 0, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 0, 68, 0.2);
        }

        .query-type.GET {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .query-type.CONNECT {
            background: rgba(255, 204, 0, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 204, 0, 0.2);
        }

        .query-type.POST {
            background: rgba(161, 48, 252, 0.1);
            color: #a130fc;
            border: 1px solid rgba(161, 48, 252, 0.2);
        }

        .query-domain {
            flex: 1;
            /* Allow wrapping for long URLs */
            white-space: normal;
            word-break: break-all;
            overflow: visible;
            color: #c4c279;
            line-height: 1.4;
        }

        .query-status {
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 80px;
            text-align: center;
        }

        .query-status.blocked {
            background: rgba(255, 0, 68, 0.1);
            color: var(--danger);
        }

        .query-status.allowed {
            background: rgba(0, 255, 136, 0.1);
            color: var(--success);
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            border: none;
        }

        .btn-accent:hover {
            background: #ff2266;
        }

        @media (max-width: 1000px) {
            .sidebar {
                width: 80px;
            }

            .logo span:not(.icon),
            .nav-item span:not(.icon) {
                display: none;
            }

            .nav-item {
                justify-content: center;
            }

            :root {
                --sidebar-width: 80px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* Background Animations */
        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(80px);
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            top: -200px;
            left: -200px;
        }

        .glow-orb-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.1) translate(30px, 30px);
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--border) 2px, var(--border) 4px);
            pointer-events: none;
            opacity: 0.03;
            z-index: 100;
        }

        .page-wrapper {
            display: flex;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <!-- Animated Background Layers -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scanline"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="page-wrapper">
        <div id="sidebar-container"></div>
        <script src="/assets/sidebar.js"></script>

        <!-- Main Content Area -->
        <main class="main-content">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <h1><span class="icon icon-lg">shield</span> Proxy Engine</h1>
                <div id="statusBadge" class="status-badge">
                    <span class="icon" style="font-size: 0.5rem;">circle</span>
                    <span>SYSTEM ACTIVE</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="/blocklist?type=proxy" class="btn"><span class="icon">block</span> Manage Blocklist</a>
                <a href="/logs-history?type=proxy" class="btn"><span class="icon">folder</span> Log History</a>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title"><span class="icon">sensors</span> Real-time Traffic</div>
                    <button class="btn" style="padding: 4px 12px; font-size: 0.7rem;" onclick="clearLogs()">Clear
                        Use</button>
                </div>
                <div class="query-list" id="queryList">
                    <div class="empty-state">Waiting for traffic stream...</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalRequests">0</div>
                    <div class="stat-label">Total Volume</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="blockedCount" style="color: var(--danger);">0</div>
                    <div class="stat-label">Security Blocks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="getRequests">0</div>
                    <div class="stat-label">Web Traffic</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="connectRequests">0</div>
                    <div class="stat-label">HTTPS Tunnels</div>
                </div>
            </div>
        </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let stats = { total: 0, blocked: 0, get: 0, connect: 0 };
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');

        /* Shared sidebar functions are now in sidebar.js */

        async function fetchWithAudit(url, options = {}) {
            options.headers = { ...options.headers, 'x-user': currentUser.username };
            return fetch(url, options);
        }

        socket.on('logs', (entries) => {
            const list = document.getElementById('queryList');
            // Remove empty state if present
            const empty = list.querySelector('.empty-state');
            if (empty) empty.remove();

            entries.forEach(log => {
                const entry = document.createElement('div');
                const isBlocked = log.method === 'BLOCK';
                entry.className = `query-item ${isBlocked ? 'blocked' : 'allowed'}`;

                const time = new Date().toLocaleTimeString('en-US', { hour12: false });

                entry.innerHTML = `
                    <span class="query-time">${time}</span>
                    <span class="query-type ${log.method}">${log.method}</span>
                    <span class="query-domain" title="${log.url}">${log.url}</span>
                    <span class="query-status ${isBlocked ? 'blocked' : 'allowed'}">${isBlocked ? 'BLOCKED' : 'ALLOWED'}</span>
                `;

                list.prepend(entry);
                if (list.children.length > 100) list.removeChild(list.lastChild);

                stats.total++;
                if (log.method === 'BLOCK') stats.blocked++;
                else if (log.method === 'GET') stats.get++;
                else if (log.method === 'CONNECT') stats.connect++;

                updateStatsUI();
            });
        });

        function updateStatsUI() {
            document.getElementById('totalRequests').textContent = stats.total.toLocaleString();
            document.getElementById('blockedCount').textContent = stats.blocked.toLocaleString();
            document.getElementById('getRequests').textContent = stats.get.toLocaleString();
            document.getElementById('connectRequests').textContent = stats.connect.toLocaleString();
        }

        function clearLogs() {
            document.getElementById('queryList').innerHTML = '<div class="empty-state">Waiting for traffic stream...</div>';
        }

        async function fetchInitialStats() {
            try {
                const res = await fetchWithAudit('/api/stats');
                const data = await res.json();
                stats = {
                    total: data.totalRequests || 0,
                    get: data.getRequests || 0,
                    connect: data.connectRequests || 0,
                    blocked: data.blockedRequests || 0
                };
                updateStatsUI();
            } catch (e) { }
        }

        fetchWithAudit('/api/audit/page-view', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page: 'Proxy Dashboard' })
        });

        fetchInitialStats();
    </script>
    <script>
        // Background animations
        (function () {
            const CONFIG = {
                PARTICLE_COUNT: 50,
                PARTICLE_REPEL_DISTANCE: 200,
                CONNECTION_MAX_DISTANCE: 120,
                PARTICLE_SPEED_MULTIPLIER: 0.5,
                PARTICLE_SIZE_MIN: 1,
                PARTICLE_SIZE_MAX: 3,
                PARTICLE_OPACITY_MIN: 0.2,
                PARTICLE_OPACITY_MAX: 0.5,
                CONNECTION_OPACITY_BASE: 0.15
            };

            // Particle System
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width, height;
            let mouseX = 0, mouseY = 0;
            let particles = [];
            let animationFrameId = null;
            let isTabVisible = !document.hidden;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            document.addEventListener('visibilitychange', () => {
                isTabVisible = !document.hidden;
                if (isTabVisible && !animationFrameId) {
                    animate();
                }
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * (CONFIG.PARTICLE_SIZE_MAX - CONFIG.PARTICLE_SIZE_MIN) + CONFIG.PARTICLE_SIZE_MIN;
                    this.speedX = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.speedY = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.opacity = Math.random() * (CONFIG.PARTICLE_OPACITY_MAX - CONFIG.PARTICLE_OPACITY_MIN) + CONFIG.PARTICLE_OPACITY_MIN;
                }

                update() {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONFIG.PARTICLE_REPEL_DISTANCE) {
                        const force = (CONFIG.PARTICLE_REPEL_DISTANCE - dist) / CONFIG.PARTICLE_REPEL_DISTANCE;
                        this.x -= (dx / dist) * force * 3;
                        this.y -= (dy / dist) * force * 3;
                    }

                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 0, 68, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.CONNECTION_MAX_DISTANCE) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 0, 68, ${CONFIG.CONNECTION_OPACITY_BASE * (1 - dist / CONFIG.CONNECTION_MAX_DISTANCE)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                if (!isTabVisible) {
                    animationFrameId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                drawConnections();
                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
    <script src="/assets/modal.js"></script>
</body>

</html>
