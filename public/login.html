<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Secure login - Chakhdi.local Gateway Access" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" />
    <title>Secure Access | Chakhdi.local</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='30' y='45' width='40' height='40' rx='4' fill='%2300f3ff' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M 38 45 L 38 35 Q 38 20 50 20 Q 62 20 62 35 L 62 45' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='65' r='4' fill='%23ffffff'/%3E%3Cline x1='50' y1='69' x2='50' y2='76' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            --bg: #050510;
            --surface: #10101a;
            --text-primary: #e0e0ff;
            --text-secondary: #9999bb;
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.3);
            --warning: #ffcc00;
            --danger: #ff0044;
            --grid-color: rgba(255, 0, 68, 0.05);
            --grid-alt: rgba(0, 243, 255, 0.04);
            --orb-color: rgba(255, 0, 68, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        /* Smooth color transitions */
        :root,
        .time-display,
        .logo-icon,
        .btn-login,
        footer strong,
        .back-link {
            transition: color 3s cubic-bezier(0.4, 0, 0.2, 1), border-color 3s cubic-bezier(0.4, 0, 0.2, 1), background-color 3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(255, 0, 68, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 68, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: morphShapes 60s ease-in-out infinite;
        }

        @keyframes morphShapes {
            0%, 100% {
                background-image:
                    linear-gradient(var(--grid-color) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
                background-size: 60px 60px;
                opacity: 1;
            }
            14% {
                background-image:
                    linear-gradient(var(--grid-color) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
                background-size: 80px 80px;
                opacity: 0.9;
            }
            28% {
                background-image:
                    radial-gradient(circle, var(--grid-color) 2px, transparent 2px),
                    radial-gradient(circle, var(--grid-alt) 1.5px, transparent 1.5px);
                background-size: 50px 50px, 25px 25px;
                background-position: 0 0, 25px 25px;
                opacity: 0.85;
            }
            42% {
                background-image:
                    linear-gradient(var(--grid-color) 0.5px, transparent 0.5px),
                    linear-gradient(90deg, var(--grid-color) 0.5px, transparent 0.5px);
                background-size: 40px 40px;
                opacity: 0.9;
            }
            56% {
                background-image:
                    repeating-linear-gradient(45deg, transparent, transparent 60px, var(--grid-color) 60px, var(--grid-color) 61px),
                    repeating-linear-gradient(-45deg, transparent, transparent 60px, var(--grid-alt) 60px, var(--grid-alt) 61px);
                background-size: 100% 100%;
                opacity: 0.8;
            }
            70% {
                background-image:
                    radial-gradient(circle, var(--grid-color) 1.5px, transparent 1.5px),
                    linear-gradient(90deg, var(--grid-alt) 1px, transparent 1px);
                background-size: 60px 60px, 120px 60px;
                opacity: 0.85;
            }
            84% {
                background-image:
                    linear-gradient(var(--grid-color) 1.5px, transparent 1.5px),
                    linear-gradient(90deg, var(--grid-color) 1.5px, transparent 1.5px);
                background-size: 100px 100px;
                opacity: 0.9;
            }
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--orb-color) 0%, transparent 70%);
            filter: blur(80px);
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        .glow-orb-1 {
            top: -200px;
            left: -200px;
        }

        .glow-orb-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0%, 100% {
                transform: scale(1) translate(0, 0);
            }
            50% {
                transform: scale(1.1) translate(30px, 30px);
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px);
            pointer-events: none;
            z-index: 100;
        }

        .time-display {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(26, 26, 26, 0.85);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            z-index: 50;
        }

        /* Page Fade-in Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container {
            background: rgba(26, 26, 26, 0.9);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 0, 68, 0.3);
            box-shadow: 0 0 80px var(--accent-glow), 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: iconPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 243, 255, 0.6));
            display: inline-block;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.5));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 40px rgba(0, 243, 255, 0.8));
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.6s ease 0.2s both;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease 0.3s both;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(0, 243, 255, 0.08);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            border: none;
            border-radius: 12px;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
            margin-top: 0.5rem;
            animation: fadeIn 0.6s ease 0.5s both;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-login:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #success-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeInOverlay 0.6s ease forwards;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #000;
            margin-bottom: 2rem;
            box-shadow: 0 0 60px var(--accent-glow), 0 0 120px rgba(0, 243, 255, 0.2);
            animation: successPulse 2s ease-in-out infinite;
        }

        @keyframes successPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 60px var(--accent-glow);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 80px var(--accent-glow);
            }
        }

        .success-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }

        .countdown-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #0ea5e9);
            box-shadow: 0 0 15px var(--accent-glow);
            transition: width 0.1s linear;
        }

        footer {
            position: fixed;
            bottom: 24px;
            left: 24px;
            font-size: 0.8rem;
            color: #666;
            z-index: 50;
            background: rgba(10, 10, 20, 0.8);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        footer strong {
            color: var(--accent);
        }

        .back-link {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            padding: 10px 20px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            background: rgba(0, 243, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
        }

        .back-link:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 2rem 1.5rem;
                max-width: 95%;
            }
            h1 { font-size: 1.75rem; }
            .logo-icon { font-size: 3.5rem; }
            .time-display {
                font-size: 0.75rem;
                padding: 8px 12px;
            }
            footer {
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
                font-size: 0.7rem;
            }
            .back-link {
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                right: auto;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scanline"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="time-display" id="timeDisplay" role="timer" aria-label="Current time" aria-live="off">00:00:00</div>

    <div id="success-overlay">
        <div class="success-icon" role="img" aria-label="Success icon">✓</div>
        <div class="success-text">You are Verified</div>
        <div class="countdown-text" id="countdown">Initialising System...</div>
        <div class="progress-container" role="progressbar" aria-label="Redirect progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="auth-container" role="main" aria-live="polite">
        <div class="logo-icon" role="img" aria-label="Lock icon">🔐</div>
        <h1>Chakhdi.local</h1>
        <p class="tagline">Secure Gateway Access</p>

        <form id="loginForm" onsubmit="return handleLogin(event)" autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="new-password" autocapitalize="off" spellcheck="false">
            </div>

            <!-- Display current IP and MAC -->
            <div style="background: rgba(0, 243, 255, 0.08); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 12px; padding: 12px; margin-bottom: 1rem; text-align: left;">
                <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;">Your Device Information:</div>
                <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem;">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary);">IP Address:</span>
                        <span id="clientIp" style="color: var(--accent); font-weight: 600;">Loading...</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-secondary);">MAC Address:</span>
                        <span id="clientMac" style="color: var(--accent); font-weight: 600;">Loading...</span>
                    </div>
                </div>
                <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 8px; font-style: italic;">
                    Login must be authorized for your MAC address
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>
    </div>

    <a href="/" class="back-link" aria-label="Back to home">
        <span role="img" aria-label="Home icon">🏠</span>
        <span>Home</span>
    </a>

    <footer role="contentinfo">
        <strong>Chakhdi.local</strong> © <span id="currentYear">2026</span> • Jay Saminarayan
    </footer>

    <script>
        (function() {
            'use strict';
            
            // Fetch and display client IP and MAC
            async function loadClientInfo() {
                try {
                    const res = await fetch('/api/client-info');
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('clientIp').textContent = data.ip || 'unknown';
                        document.getElementById('clientMac').textContent = data.mac || 'unknown';
                    }
                } catch (err) {
                    console.error('Failed to load client info:', err);
                    document.getElementById('clientIp').textContent = 'Error';
                    document.getElementById('clientMac').textContent = 'Error';
                }
            }
            
            // Load client info on page load
            loadClientInfo();
            
            const CONFIG = {
                PARTICLE_COUNT: 50,
                PARTICLE_REPEL_DISTANCE: 200,
                CONNECTION_MAX_DISTANCE: 120,
                PARTICLE_SPEED_MULTIPLIER: 0.5,
                PARTICLE_SIZE_MIN: 1,
                PARTICLE_SIZE_MAX: 3,
                PARTICLE_OPACITY_MIN: 0.2,
                PARTICLE_OPACITY_MAX: 0.5,
                CONNECTION_OPACITY_BASE: 0.15,
                COLOR_CYCLE_INTERVAL: 5000,
                TIME_UPDATE_INTERVAL: 1000,
                ANIMATION_INTERVAL: 16
            };

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const protectedInputs = [usernameInput, passwordInput].filter(Boolean);
            protectedInputs.forEach((input) => {
                ['copy', 'cut', 'paste'].forEach((evt) => {
                    input.addEventListener(evt, (e) => e.preventDefault());
                });
                input.addEventListener('contextmenu', (e) => e.preventDefault());
            });

            document.getElementById('currentYear').textContent = new Date().getFullYear();

            const colorSchemes = [
                { name: 'Cyan/Red', bg: '#050510', accent: '#00f3ff', danger: '#ff0044', gridColor: 'rgba(255, 0, 68, 0.05)', gridAlt: 'rgba(0, 243, 255, 0.04)', orbColor: 'rgba(255, 0, 68, 0.15)' },
                { name: 'Purple/Pink', bg: '#0f0514', accent: '#a855f7', danger: '#ec4899', gridColor: 'rgba(236, 72, 153, 0.05)', gridAlt: 'rgba(168, 85, 247, 0.04)', orbColor: 'rgba(236, 72, 153, 0.15)' },
                { name: 'Green/Lime', bg: '#051209', accent: '#10b981', danger: '#84cc16', gridColor: 'rgba(132, 204, 22, 0.05)', gridAlt: 'rgba(16, 185, 129, 0.04)', orbColor: 'rgba(132, 204, 22, 0.15)' },
                { name: 'Blue/Indigo', bg: '#050a14', accent: '#3b82f6', danger: '#6366f1', gridColor: 'rgba(99, 102, 241, 0.05)', gridAlt: 'rgba(59, 130, 246, 0.04)', orbColor: 'rgba(99, 102, 241, 0.15)' },
                { name: 'Orange/Amber', bg: '#140a05', accent: '#f97316', danger: '#fbbf24', gridColor: 'rgba(251, 191, 36, 0.05)', gridAlt: 'rgba(249, 115, 22, 0.04)', orbColor: 'rgba(251, 191, 36, 0.15)' },
                { name: 'Teal/Emerald', bg: '#05120f', accent: '#14b8a6', danger: '#10b981', gridColor: 'rgba(16, 185, 129, 0.05)', gridAlt: 'rgba(20, 184, 166, 0.04)', orbColor: 'rgba(16, 185, 129, 0.15)' },
                { name: 'Magenta/Rose', bg: '#140510', accent: '#d946ef', danger: '#f43f5e', gridColor: 'rgba(244, 63, 94, 0.05)', gridAlt: 'rgba(217, 70, 239, 0.04)', orbColor: 'rgba(244, 63, 94, 0.15)' },
                { name: 'Sky/Blue', bg: '#050f14', accent: '#0ea5e9', danger: '#06b6d4', gridColor: 'rgba(6, 182, 212, 0.05)', gridAlt: 'rgba(14, 165, 233, 0.04)', orbColor: 'rgba(6, 182, 212, 0.15)' }
            ];

            let currentSchemeIndex = 0;

            function changeColorScheme() {
                const scheme = colorSchemes[currentSchemeIndex];
                const root = document.documentElement;
                
                // Smoothly transition all colors including background with CSS
                root.style.setProperty('--bg', scheme.bg);
                root.style.setProperty('--accent', scheme.accent);
                root.style.setProperty('--accent-glow', `${scheme.accent}4d`);
                root.style.setProperty('--danger', scheme.danger);
                root.style.setProperty('--grid-color', scheme.gridColor);
                root.style.setProperty('--grid-alt', scheme.gridAlt);
                root.style.setProperty('--orb-color', scheme.orbColor);
                
                currentSchemeIndex = (currentSchemeIndex + 1) % colorSchemes.length;
            }

            let lastColorTime = 0, lastTimeUpdate = 0, animationStartTime = Date.now();
            
            function unifiedLoop() {
                const now = Date.now();
                const elapsed = now - animationStartTime;
                if (now - lastTimeUpdate >= CONFIG.TIME_UPDATE_INTERVAL) {
                    updateTime();
                    lastTimeUpdate = now;
                }
                if (elapsed - lastColorTime >= CONFIG.COLOR_CYCLE_INTERVAL) {
                    changeColorScheme();
                    lastColorTime = elapsed;
                }
            }
            
            setInterval(unifiedLoop, CONFIG.ANIMATION_INTERVAL);
            
            const timeDisplay = document.getElementById('timeDisplay');
            function updateTime() {
                if (!timeDisplay) return;
                timeDisplay.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
            }
            updateTime();

            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            let width, height, mouseX = 0, mouseY = 0, particles = [], animationFrameId = null, isTabVisible = !document.hidden;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            function updatePosition(x, y) {
                mouseX = x;
                mouseY = y;
            }
            
            document.addEventListener('mousemove', (e) => updatePosition(e.clientX, e.clientY));
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) updatePosition(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            
            document.addEventListener('visibilitychange', () => {
                isTabVisible = !document.hidden;
                if (isTabVisible && !animationFrameId) animate();
            });

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * (CONFIG.PARTICLE_SIZE_MAX - CONFIG.PARTICLE_SIZE_MIN) + CONFIG.PARTICLE_SIZE_MIN;
                    this.speedX = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.speedY = (Math.random() - 0.5) * CONFIG.PARTICLE_SPEED_MULTIPLIER;
                    this.opacity = Math.random() * (CONFIG.PARTICLE_OPACITY_MAX - CONFIG.PARTICLE_OPACITY_MIN) + CONFIG.PARTICLE_OPACITY_MIN;
                }
                update() {
                    const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.PARTICLE_REPEL_DISTANCE) {
                        const force = (CONFIG.PARTICLE_REPEL_DISTANCE - dist) / CONFIG.PARTICLE_REPEL_DISTANCE;
                        this.x -= (dx / dist) * force * 3;
                        this.y -= (dy / dist) * force * 3;
                    }
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
                draw(dangerColor) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const rgb = dangerColor.match(/\d+/g);
                    ctx.fillStyle = (rgb && rgb.length >= 3) ? `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${this.opacity})` : `rgba(255, 0, 68, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) particles.push(new Particle());

            function drawConnections(dangerColor) {
                const rgb = dangerColor.match(/\d+/g);
                const baseColor = (rgb && rgb.length >= 3) ? `${rgb[0]}, ${rgb[1]}, ${rgb[2]}` : '255, 0, 68';
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.CONNECTION_MAX_DISTANCE) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(${baseColor}, ${CONFIG.CONNECTION_OPACITY_BASE * (1 - dist / CONFIG.CONNECTION_MAX_DISTANCE)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                if (!isTabVisible) {
                    animationFrameId = null;
                    return;
                }
                ctx.clearRect(0, 0, width, height);
                const dangerColor = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim();
                particles.forEach(p => { p.update(); p.draw(dangerColor); });
                drawConnections(dangerColor);
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        })();

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('dashboardAuth', 'true');
                    sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                    sessionStorage.setItem('sessionId', data.sessionId);
                    prefetchDashboardAssets();
                    showSuccess();
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (err) {
                btn.textContent = 'Access Denied';
                btn.style.background = 'linear-gradient(135deg, #ff0044, #dc2626)';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    btn.style.background = '';
                }, 2000);
            }
            return false;
        }

        function prefetchDashboardAssets() {
            const targets = [
                '/dashboard',
                '/assets/icons.css',
                '/assets/sidebar.css',
                '/assets/sidebar.js',
                '/assets/modal.js'
            ];

            const apiTargets = [
                '/api/stats',
                '/api/dns/stats'
            ];

            const run = () => {
                targets.forEach((href) => {
                    const link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = href;
                    link.as = href.endsWith('.css') ? 'style' : href.endsWith('.js') ? 'script' : 'document';
                    link.crossOrigin = 'anonymous';
                    document.head.appendChild(link);
                });

                // Warm the HTML in cache even if rel=prefetch is ignored by some browsers.
                fetch('/dashboard', { credentials: 'same-origin', cache: 'force-cache' }).catch(() => {});

                // Warm API caches for initial dashboard stats.
                apiTargets.forEach((url) => {
                    fetch(url, {
                        credentials: 'same-origin',
                        headers: {
                            'x-user': JSON.parse(sessionStorage.getItem('currentUser') || '{}').username || 'Unknown',
                            'x-session-id': sessionStorage.getItem('sessionId') || 'unknown',
                            'user-agent': navigator.userAgent
                        }
                    }).catch(() => {});
                });
            };

            if ('requestIdleCallback' in window) {
                requestIdleCallback(run, { timeout: 1500 });
            } else {
                setTimeout(run, 200);
            }
        }

        function showSuccess() {
            document.getElementById('success-overlay').style.display = 'flex';
            const totalDuration = 5000, startTime = Date.now();
            const el = document.getElementById('countdown'), bar = document.getElementById('progressBar');

            function updateProgress() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / totalDuration) * 100, 100);
                const remaining = Math.ceil((totalDuration - elapsed) / 1000);
                bar.style.width = `${progress}%`;
                if (remaining > 0) {
                    el.textContent = `Redirecting in ${remaining}s`;
                    requestAnimationFrame(updateProgress);
                } else {
                    el.textContent = 'Redirecting...';
                    setTimeout(() => window.location.href = '/', 300);
                }
            }
            requestAnimationFrame(updateProgress);
        }
    </script>
