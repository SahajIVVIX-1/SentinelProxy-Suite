<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Audit • Chakhdi.local</title>
    <script>
        const user = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        if (sessionStorage.getItem('dashboardAuth') !== 'true' || user.role !== 'admin') {
            window.location.href = '/dashboard';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/icons.css">
    <link rel="stylesheet" href="/assets/sidebar.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2336d1dc'/><path d='M20 34l8 8 16-20' fill='none' stroke='%23030308' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        :root {
            --bg: #030308;
            --surface: #0a0a14;
            --surface-hover: #121225;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --accent: #36d1dc;
            --accent-glow: rgba(54, 209, 220, 0.2);
            --danger: #ff0044;
            --success: #00ff88;
            --warning: #ffcc00;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 16px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .health-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        .health-badge.readonly {
            border-color: rgba(255, 0, 68, 0.4);
            color: var(--danger);
            background: rgba(255, 0, 68, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-body {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            font-size: 0.8rem;
        }

        .list-item:hover {
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
        }

        .list-count {
            font-family: 'JetBrains Mono', monospace;
            color: var(--success);
            font-size: 0.75rem;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-item {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.8rem;
        }

        .timeline-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.7rem;
            margin-top: 6px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 10px;
            font-size: 0.8rem;
        }

        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .panel-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 80px;
            }

            .logo span:not(.icon),
            .nav-item span:not(.icon) {
                display: none;
            }

            :root {
                --sidebar-width: 80px;
            }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(80px);
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            top: -200px;
            left: -200px;
        }

        .glow-orb-2 {
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.1) translate(30px, 30px);
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--border) 2px, var(--border) 4px);
            pointer-events: none;
            opacity: 0.03;
            z-index: 100;
        }

        .dashboard-wrapper {
            display: flex;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scanline"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>
        <script src="/assets/sidebar.js"></script>

        <main class="main-content">
            <div class="header">
                <h1><span class="icon icon-lg">analytics</span> Self Audit</h1>
                <div class="health-badge" id="healthBadge">
                    <span class="icon">health_and_safety</span>
                    <span id="healthText">Health check...</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="dnsBlocked">0</div>
                    <div class="stat-label">DNS Blocks (24h)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="proxyBlocked">0</div>
                    <div class="stat-label">Proxy Blocks (24h)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="adaptiveCount">0</div>
                    <div class="stat-label">Adaptive Suggestions</div>
                </div>
            </div>

            <div class="panel-grid">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">dns</span> Top DNS Blocks</div>
                        <span style="color: var(--text-secondary); font-size: 0.75rem;" id="dnsTopCount">0</span>
                    </div>
                    <div class="panel-body" id="dnsTopList">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">shield</span> Top Proxy Blocks</div>
                        <span style="color: var(--text-secondary); font-size: 0.75rem;" id="proxyTopCount">0</span>
                    </div>
                    <div class="panel-body" id="proxyTopList">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">warning</span> Adaptive Suggestions</div>
                    </div>
                    <div class="panel-body" id="adaptiveList">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><span class="icon">timeline</span> Security Timeline</div>
                    </div>
                    <div class="panel-body" id="timelineList">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
        const currentSessionId = sessionStorage.getItem('sessionId') || 'unknown';

        async function fetchWithAudit(url, options = {}) {
            options.headers = {
                ...options.headers,
                'x-user': currentUser.username,
                'x-session-id': currentSessionId,
                'user-agent': navigator.userAgent
            };
            return fetch(url, options);
        }

        function renderTopList(container, items, labelKey) {
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state">No data</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="list-item">
                    <span>${item[labelKey] || 'unknown'}</span>
                    <span class="list-count">${item.count}</span>
                </div>
            `).join('');
        }

        function renderAdaptive(container, items) {
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state">No suggestions</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="list-item">
                    <span>${item.domain}</span>
                    <span class="list-count">${item.score}</span>
                </div>
            `).join('');
        }

        function renderTimeline(container, items) {
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state">No recent events</div>';
                return;
            }
            container.innerHTML = items.map(item => {
                const time = item.timestamp ? new Date(item.timestamp.replace(' ', 'T') + 'Z').toLocaleString() : '-';
                return `
                    <div class="timeline-item">
                        <div><strong>${item.action}</strong> • ${item.user || 'system'}</div>
                        <div>${item.details || '-'}</div>
                        <div class="timeline-meta">
                            <span>${time}</span>
                            <span>${item.session_id || ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadAudit() {
            try {
                const res = await fetchWithAudit('/api/self-audit');
                const data = await res.json();

                document.getElementById('dnsBlocked').textContent = (data.blocked?.dns || 0).toLocaleString();
                document.getElementById('proxyBlocked').textContent = (data.blocked?.proxy || 0).toLocaleString();
                document.getElementById('adaptiveCount').textContent = (data.adaptiveSuggestions || []).length.toLocaleString();

                document.getElementById('dnsTopCount').textContent = (data.topBlocked?.dns || []).length;
                document.getElementById('proxyTopCount').textContent = (data.topBlocked?.proxy || []).length;

                renderTopList(document.getElementById('dnsTopList'), data.topBlocked?.dns || [], 'domain');
                renderTopList(document.getElementById('proxyTopList'), data.topBlocked?.proxy || [], 'host');
                renderAdaptive(document.getElementById('adaptiveList'), data.adaptiveSuggestions || []);
                renderTimeline(document.getElementById('timelineList'), data.auditTimeline || []);

                const badge = document.getElementById('healthBadge');
                const text = document.getElementById('healthText');
                if (data.health?.enabled) {
                    badge.classList.add('readonly');
                    text.textContent = `Read-only mode: ${data.health.reason || 'unknown'}`;
                } else {
                    badge.classList.remove('readonly');
                    text.textContent = 'Healthy';
                }
            } catch (err) {
                console.error('Self-audit load failed', err);
            }
        }

        fetchWithAudit('/api/audit/page-view', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page: 'Self Audit' })
        });

        loadAudit();
        setInterval(loadAudit, 10000);
    </script>
    <script src="/assets/modal.js"></script>
</body>

</html>
